                { title: "La Boca：河港的調色盤", text: "La Boca（西班牙語意為「河口」）位於布宜諾斯艾利斯南邊的里亞丘埃洛河畔，是十九世紀義大利熱那亞移民的聚居地。這些碼頭工人用港口剩餘的船漆塗刷自己簡陋的鐵皮木屋——每一面牆都是不同顏色的拼接，因為漆料永遠不夠用同一種顏色塗完整面牆。這個「廢物利用」的無奈之舉，意外創造了今天我們看到的繽紛街景。最著名的卡米尼托小街（Caminito）全長僅 150 公尺，兩側鋪滿彩色浮雕、街頭探戈舞者和藝術家的露天畫廊。卡米尼托的名字來自 1926 年的一首探戈名曲，歌詞描述一條被荒廢的小路，就像離去的愛人不再回頭。如今這條小路已成為布宜諾斯艾利斯最多人拍照的地方。La Boca 也是阿根廷最狂熱的足球聖地——博卡青年隊的主場「La Bombonera」（糖果盒球場）就在附近，球王乞求馬拉度納曾在這裡踢球，他是 La Boca 永遠的神。" },

                    sections: [
                        { title: "早安 BA！抵達藝術殿堂", text: "早安。今天我們將展開一場靈魂的對話。我們來到了 MALBA——拉丁美洲藝術博物館，全名 Museo de Arte Latinoamericano de Buenos Aires。這座博物館於 2001 年 9 月開幕，由阿根廷企業家 Eduardo Costantini 出資創建，收藏了超過 700 件拉美現當代藝術精品。建築由三位阿根廷建築師設計，以大量的石灰岩板與玻璃帷幕構成不規則幾何體，讓自然光成為展廳的第一位策展人。請注意入口大廳那道七層樓高的玻璃牆，光線隨時間移動，讓作品在不同時刻呈現不同表情。門票一人 5,000 阿根廷披索，週三半價。" },
                        { title: "1. 芙烈達·卡蘿", text: "請停留在這幅畫前。這是 Frida Kahlo 的《與猴子一起的自畫像》，繪於 1945 年。芙烈達一生畫了 55 幅自畫像，她曾說：『我畫自己，因為我最了解的就是自己。』畫中的她表情嚴肅而堅毅，標誌性的連心眉毛與深色眼神直視著你。那隻擁抱著她的蜘蛛猴，是她無法生育的痛苦中，情感轉移的象徵——她飼養了多隻猴子，視牠們如同自己的孩子。黃色的絲帶將她、猴子與鸚鵡緊緊繫在一起，象徵著她與自然、與痛苦密不可分的連結。芙烈達 18 歲時遭遇的車禍讓她終生承受 32 次手術之苦，而正是這些痛苦，催生了二十世紀最動人的藝術。" },
                        { title: "2. 塔爾西拉·多·阿馬拉爾", text: "這幅畫是 MALBA 的鎮館之寶——塔爾西拉（Tarsila do Amaral）1928 年創作的《阿巴波魯》（Abaporu）。這個名字來自圖皮語，意為「吃人的人」。畫中人物擁有巨大得不成比例的腳掌和微小的頭顱，旁邊一棵仙人掌和一輪太陽。塔爾西拉把這幅畫送給丈夫、詩人 Oswald de Andrade 作為生日禮物，竟直接引爆了巴西文學史上著名的「食人主義運動」（Antropofagia）——主張巴西文化應該像食人族一樣吞噬外來的歐洲文化，消化後轉化為巴西獨有的養分。2019 年 Costantini 以約 800 萬美金的天價購入此作，使它成為拉丁美洲藝術史上成交價最高的作品之一。" },
                        { title: "3. 安東尼奧·貝爾尼", text: "這是阿根廷國寶畫家 Antonio Berni（1905-1981）的代表作《示威》（Manifestación），創作於 1934 年全球經濟大蕭條期間。請注意這幅作品的尺寸——寬近三公尺，畫在粗糙的布袋麻布上而非傳統畫布。畫面中幾十張工人的臉孔擠滿畫面，他們的眼神充滿焦慮與憤怒，高舉的標語牌上寫著對麵包與工作的訴求。Berni 採用了「新現實主義」手法，讓這些面孔逼真到令人不安。這幅畫不是遙遠的歷史，它發出的是阿根廷底層社會最沈重的吶喊——而 90 年後的今天，阿根廷仍然經歷著經濟動盪，這幅畫依然切中時弊。" },
                        { title: "4. 狄亞哥·里維拉", text: "墨西哥壁畫三傑之一的 Diego Rivera，在成為壁畫大師之前，曾在歐洲生活了 14 年。這幅 1915 年的作品《Ramón Gómez de la Serna 的肖像》展現了他受立體派深刻影響的一面。畫中人物是西班牙前衛作家 Gómez de la Serna，被解構成破碎的幾何色塊——你可以看到他的眼鏡、鬍子、書本散落在畫面各處。里維拉當時與畢卡索、莫迪利亞尼在巴黎混跡同一批藝術圈，但他終究選擇回到墨西哥，用壁畫為底層人民發聲，創造了足以與文藝復興比肩的公共藝術傳奇。" },
                        { title: "5. 威爾弗雷多·林", text: "這幅《綠色的早晨》（La Mañana Verde, 1943）帶我們來到古巴。Wifredo Lam 的父親是廣東移民，母親是非裔古巴人，他本人又在巴黎師從畢卡索。三種血統的交融讓他的畫獨一無二——你可以看到畢卡索立體派的幾何解構、非洲原始面具的線條，以及加勒比海的熱帶植物糾纏在一起。畫中像馬又像人的靈體，充滿了古巴「薩泰里阿教」（Santería）的巫術氛圍。據說畢卡索看了林的畫後曾說：『他比我們都走得更遠。』" },
                        { title: "6. 舒爾·索拉", text: "Xul Solar（1887-1963）是阿根廷文學巨匠波赫士（Borges）的摯友，兩人交往超過 30 年。波赫士稱他為『我們這個時代最非凡的人物之一』。這幅畫充滿了奇怪的符號、漂浮的建築與不存在的文字。Xul Solar 不只是畫家，他發明了兩種人工語言——「泛語」（Neocriollo）和「泛棋」（Panjuego），設計了一套融合占星術與塔羅牌的神秘學體系，甚至發明了一種鋼琴鍵盤可以投射色彩的樂器。他的畫作就像通往平行宇宙的地圖，每次觀看都能發現新的密碼。" },
                        { title: "7. 艾米利奧·佩托魯蒂", text: "Emilio Pettoruti 的《人民之歌》（El Quinteto, 1927）展示了五位音樂家被切分成幾何色塊的演奏場景。光線像玻璃片一樣穿透畫面，讓你幾乎能聽見音樂的節奏。1924 年佩托魯蒂在布宜諾斯艾利斯舉辦個展時，保守派觀眾衝進展場打砸作品，批評他「侮辱了藝術」。一個世紀後，他的畫早已成為阿根廷前衛藝術的里程碑，被印上郵票與教科書。藝術的命運總是如此——先被唾罵，再被供奉。" },
                        { title: "8. 羅伯托·馬塔", text: "智利畫家 Roberto Matta（1911-2002）的《神秘主義的災難》充滿流動的熔岩、爆裂的星體與扭曲的空間。他早年在巴黎跟隨柯比意學建築，後來加入超現實主義運動，成為布勒東最欣賞的年輕畫家。Matta 稱自己的畫為「心理景觀」（Psychological Morphology），描繪的是人類潛意識中恐懼與慾望交織的宇宙。二戰期間他流亡紐約，直接影響了美國抽象表現主義的誕生。杜乃伊與波洛克都承認受過他的啟發。" },
                        { title: "9. 豪爾赫·德拉維加", text: "Jorge de la Vega（1930-1971）的《拼圖》（Rompecabezas）打破了平面與立體的界限。黑白對比強烈的人物在畫布上交纏、變形、融合，反映了 1960 年代阿根廷社會在軍事政變與文化革命之間的撕裂與混亂。德拉維加是「新具象主義」（Nueva Figuración）運動的核心成員，這群藝術家拒絕純粹抽象，堅持讓人的形體出現在畫面中——但那些人體已被扭曲得面目全非，像一首視覺的搖滾樂。他 41 歲英年早逝，留下的作品不到三百件，每一件都是燃燒殆盡的證據。" },
                        { title: "10. 費爾南多·波特羅", text: "這是哥倫比亞大師 Fernando Botero（1932-2023）的《鰥夫》。圓潤誇張的造型是他畢生的標誌——但請不要簡單地稱它們為「胖」。波特羅曾解釋：『我不是在畫胖子，我是在用體積感來探索形式的感官愉悅。』他的人物不管是總統、妓女還是水果，全部被充氣般地膨脹，用這種方式挑戰觀者對美與醜的判斷。波特羅出生在哥倫比亞第二大城麥德林，年輕時靠鬥牛海報起家，後來成為拉美藝術市場上作品最昂貴的在世藝術家。他於 2023 年辭世，享年 91 歲。" },
                        { title: "11. 赫利奧·奧伊蒂西卡", text: "巴西藝術家 Hélio Oiticica（1937-1980）的《Parangolés》是一系列可以穿在身上的彩色斗篷與旗幟。他打破了藝術品「只能看不能摸」的規則——他邀請里約熱內盧 Mangueira 貧民窟的桑巴舞者穿上這些斗篷跳舞，讓藝術在汗水與節奏中活起來。1965 年他帶著這些舞者進入里約現代美術館開幕式，被保安驅趕，他就在美術館外面展演。對奧伊蒂西卡來說，藝術不是掛在牆上的裝飾品，而是身體的解放與社會的行動。他 42 歲就去世了，但他的理念影響了全球互動藝術與行為藝術的發展。" }
                    ]
                },
                { name: "午餐：Cabaña Las Lilas", desc: "港區頂級牛排", sections: [
                    { title: "Puerto Madero 港區", text: "我們現在前往 Puerto Madero——布宜諾斯艾利斯最新、最時尚的街區。這裡原本是 1880 年代建造的港口，但因為設計失敗，僅使用了十年就被廢棄。沉睡了將近一個世紀後，1990 年代政府將紅磚倉庫群改造為餐廳、辦公室與豪華公寓，成為城市更新的典範。走在河岸步道上，你會看到 Santiago Calatrava 設計的「女人橋」（Puente de la Mujer），那道優雅的白色弧線象徵著一對跳探戈的舞者。" },
                    { title: "阿根廷牛排文化", text: "Cabaña Las Lilas 是阿根廷最負盛名的牛排餐廳之一，擁有自己的牧場，確保從產地到餐桌的品質控制。阿根廷是全球人均牛肉消費量最高的國家之一，年均每人吃掉約 50 公斤牛肉。這裡的牛採用天然草飼（Grass-fed），不用穀物催肥，所以肉質精瘦但風味濃郁。建議嘗試「Ojo de Bife」（肋眼牛排），搭配阿根廷國醬 Chimichurri——這是用新鮮巴西利、大蒜、奧勒岡、橄欖油和紅酒醋調製的綠色醬料，是阿根廷烤肉的靈魂伴侶。牛排建議點五到七分熟（a punto），這是阿根廷人最推薦的熟度。搭配一杯 Malbec 紅酒，Malbec 是阿根廷的代表性葡萄品種，原產於法國波爾多，但在門多薩的高海拔葡萄園中找到了第二故鄉，發展出比法國更濃郁飽滿的風格。" }
                ] },
                {
                    name: "市區觀光", desc: "五月廣場與玫瑰宮",
                    sections: [
                        { title: "五月廣場的歷史", text: "五月廣場（Plaza de Mayo）是阿根廷的政治心臟，自 1580 年建城以來，這裡見證了每一次改變國家命運的重大事件。廣場中央的白色金字塔型紀念碑建於 1811 年，是阿根廷最古老的國家紀念物，紀念一年前在這裡爆發的五月革命——那場革命讓阿根廷走向獨立。廣場地面上畫著白色頭巾的圖案，請低頭看看你腳下——那不是裝飾，而是記憶。" },
                        { title: "五月廣場母親", text: "1976 年至 1983 年的軍事獨裁期間，政府秘密逮捕、拷問並殺害了多達三萬名異議人士，史稱「骯髒戰爭」。這些人被從家中、學校、工廠帶走，從此人間蒸發，稱為「被失蹤者」（Desaparecidos）。1977 年 4 月 30 日，14 位母親鼓起勇氣來到五月廣場，頭戴白色嬰兒尿布作為頭巾——那是她們失蹤孩子的遺物。軍警禁止集會，她們就不停地繞圈走動，因為「走路不算集會」。每週四下午三點半，她們風雨無阻地在此繞行，持續至今已超過四十年。這是全世界最漫長的抗議行動，也是母愛最勇敢的證明。" },
                        { title: "玫瑰宮與貝隆夫人", text: "面對廣場的粉紅色建築就是「玫瑰宮」（Casa Rosada），阿根廷的總統府。為什麼是粉紅色？最浪漫的說法是：十九世紀總統薩米恩托為了調和代表聯邦派的紅色與代表集權派的白色，將兩者混合成粉紅色，象徵國家統一。更務實的說法是，當時用牛血混合石灰來粉刷外牆防潮，自然就成了粉紅色。請注意二樓中央那座著名的陽台——1951 年 10 月 17 日，身患子宮頸癌、已瘦得只剩皮包骨的貝隆夫人 Eva Perón 在丈夫的攙扶下最後一次站在這座陽台上，對著百萬群眾含淚告別。她說：『如果我死了，我要你們記住的唯一一件事是——這個女人已經把一切都獻給了她的人民。』九個月後她去世，年僅 33 歲。" },
                        { title: "主教座堂", text: "廣場旁這座外觀像希臘神廟的建築是布宜諾斯艾利斯主教座堂（Catedral Metropolitana），有 12 根科林斯柱，上方的浮雕描繪舊約聖經中約瑟與兄弟在埃及重逢的場景，寓意阿根廷的民族團結。走進去，右側通道安放著南美洲解放者何塞·德·聖馬丁將軍（José de San Martín）的黑色大理石靈柩，由三位女性雕像守護，分別代表阿根廷、智利和秘魯——他解放的三個國家。靈柩前有一盞永不熄滅的火焰。更讓這座教堂聲名大噪的是：2013 年成為教宗的方濟各（Francisco），在當選前就是這裡的總主教，他曾在這座教堂主持了 21 年的彌撒。" },
                        { title: "卡比爾多", text: "白色的舊市政廳「卡比爾多」（Cabildo）是西班牙殖民時代的政治中心，最初建於 1610 年，現在看到的是 1940 年重新修復的版本。1810 年 5 月 25 日，市民聚集在卡比爾多前方要求自治，迫使西班牙總督下台，開啟了阿根廷獨立之路——這就是「五月革命」。如今卡比爾多內部是博物館，展示獨立戰爭文物。每逢國慶日，陽台上會掛出阿根廷國旗，重現兩百年前革命的時刻。" },
                        { title: "七月九日大道與方尖碑", text: "離開五月廣場，我們前往七月九日大道（Avenida 9 de Julio）。這條以獨立日命名的大道寬達 140 公尺，擁有 22 條車道，是全世界最寬的馬路。要橫越一次需要三個紅綠燈！大道中央矗立著 67.5 公尺高的方尖碑（Obelisco），建於 1936 年，紀念建城四百週年。僅花了 31 天就建成，是布宜諾斯艾利斯最具代表性的地標。有趣的是，方尖碑剛落成時飽受批評，市議會甚至一度投票通過拆除令，幸好最終未執行。如今每逢阿根廷足球隊獲勝，這裡就會擠滿數十萬球迷狂歡慶祝，是這座城市最具儀式感的場所。" }
                    ]
                },
                {
                    name: "巴羅洛宮", desc: "神曲建築",
                    sections: [
                        { title: "緣起", text: "巴羅洛宮（Palacio Barolo）建於 1919 至 1923 年間，由義大利建築師 Mario Palanti 設計，委託者是來自義大利的紡織商人 Luis Barolo。Palanti 是個狂熱的但丁信徒，他擔心一戰會摧毀義大利的文化遺產，甚至計畫將但丁的骨灰從拉文納運到布宜諾斯艾利斯保存——雖然這個計畫最終沒有實現，但他把整座建築設計成了《神曲》的立體化身。落成時它是南美洲最高的建築，高 100 公尺，至今仍是世界上唯一一座完全按照但丁《神曲》結構設計的建築物。門票一人 59,000 阿根廷披索，我們預約的是傍晚 18 點的導覽場次。" },
                        { title: "建築密碼", text: "請仔細聽這些數字密碼：建築高 100 公尺，對應《神曲》的 100 首詩篇（Canti）。22 層樓對應每首詩的音節格律——義大利詩歌的 hendecasyllable（十一音節）加上韻腳結構。整座建築分為三大區段：底層（地下室至 2 樓）是地獄（Inferno），中段（3 至 14 樓）是煉獄（Purgatorio），頂部（15 至 22 樓）是天堂（Paradiso）。連建築面積都暗藏玄機——底層佔地 1,100 平方公尺，可以拆解為 100 乘以 11，又是但丁的數字。Palanti 還在烏拉圭蒙特維多蓋了一座「兄弟樓」——薩爾沃宮（Palacio Salvo），兩座建築隔著拉普拉塔河遙遙相望。" },
                        { title: "地獄入口", text: "我們現在站在地獄的入口。請注意入口處的九個拱門——它們象徵但丁筆下的「地獄九圈」（Nove Cerchi）。每一圈懲罰不同的罪惡：第一圈是未受洗者的虛無，第二圈是色慾者被永恆風暴吹拂，第九圈則是背叛者被凍在冰湖中。但丁在地獄之門上方看到的銘言：『從這裡進入痛苦之城，從這裡進入永恆的悲傷⋯⋯進入此處者，放棄一切希望。』（Lasciate ogne speranza, voi ch'intrate）。請抬頭看拱門上的雕刻——那些扭曲的面孔與蛇形裝飾，是受詛咒靈魂的呼號。" },
                        { title: "地獄大廳", text: "走進大廳，地面上的火焰馬賽克圖案代表地獄之火。請注意柱子上雕刻的龍、蛇與怪獸——它們是地獄的守衛。昏暗的燈光是刻意設計，營造壓抑與不安的氛圍。天花板上的圖案也值得注意：交纏的藤蔓與面孔象徵罪惡的糾纏。Palanti 甚至在走廊的鑄鐵欄杆上隱藏了龍的造型，如果你仔細看，會發現扶手的末端都是龍頭形狀。整個空間讓你感受到但丁描述的那種「黑暗的森林」——迷失、恐懼、但又被一種奇異的美吸引著往前走。" },
                        { title: "通往煉獄", text: "我們搭乘這台老式鳥籠電梯上升。請注意電梯指針上的字母「A」——它既代表電梯（Ascensor），也代表希臘字母 Alpha，象徵「開始」。從地獄上升到煉獄，正是但丁在維吉爾引導下開始靈魂淨化的旅程。煉獄在但丁的想像中是一座位於南半球的高山——而我們現在確實身處南半球，這讓巴羅洛宮的「煉獄」多了一層真實感。電梯緩緩上升，光線也逐漸變亮，就像靈魂正在一層層地卸下罪孽的重量。" },
                        { title: "煉獄 (4-14樓)", text: "煉獄共有七層平台，對應七宗罪：傲慢、嫉妒、憤怒、懶惰、貪婪、暴食、色慾。在但丁的故事裡，靈魂必須在每一層經歷苦修來淨化對應的罪惡。你會注意到隨著樓層上升，裝飾風格從繁複變簡潔，窗戶變大，光線變充足——這不是偶然，而是 Palanti 精心設計的敘事：靈魂正在被淨化，從黑暗走向光明。牆壁上的花紋從底層的蛇與荊棘，漸漸轉變為百合花與橄欖枝——從罪惡的象徵過渡到純潔的象徵。" },
                        { title: "天堂階梯", text: "15 樓到 22 樓是天堂。從這裡開始，引導但丁的人從維吉爾換成了他深愛的 Beatrice。樓梯變窄、變陡，象徵通往神性的道路越來越艱辛，但回報也越來越大——視野突然開闊，透過窗戶可以看到布宜諾斯艾利斯的天際線在腳下展開。空氣變得純淨清冽。Palanti 在天堂區段使用了大量白色與金色裝飾，與地獄的暗色調形成鮮明對比。天堂有九重天，最高處是上帝的所在——也就是我們即將抵達的燈塔。" },
                        { title: "塔頂燈塔", text: "我們到達了「至高天」（Empireo）——巴羅洛宮的塔頂燈塔。這座燈塔在 1923 年落成時安裝了 30 萬燭光的強力探照燈，可以照射到 90 公里外的拉普拉塔河對岸。Palanti 的設計理念是：這束光代表神性的指引，就像但丁在天堂最高處看到的那道「愛推動日月星辰的力量」（L'amor che move il sole e l'altre stelle）。他原本希望這道光能與對岸蒙特維多的薩爾沃宮燈塔互相呼應，兩束光交叉在河面上空，形成一道光的十字架——可惜兩座燈塔從未同時亮起過。" },
                        { title: "南十字星", text: "巴羅洛宮最驚人的秘密：每年 6 月上旬（南半球冬至前後），南十字星座（Cruz del Sur）會剛好出現在燈塔正上方的天頂位置。Palanti 在設計時就精確計算了建築的方位與緯度，讓這座建築與宇宙產生對話。南十字星在南半球的地位就像北極星在北半球——用來指引方向。而在但丁的《煉獄篇》開頭，但丁抬頭就看到了四顆星（被解讀為南十字星），因為煉獄位於南半球。建築與文學與天文，在這一刻完美對齊。" },
                        { title: "俯瞰 BA", text: "現在請轉身 360 度。往西看是國會大廈的穹頂，往東可以望見拉普拉塔河的銀色水面，往北是方尖碑的尖頂。夕陽正把這座城市染成玫瑰金色——這就是為什麼我們選擇傍晚場次的原因。你剛才經歷的，不只是一座建築的導覽，而是一趟從地獄到天堂的朝聖之旅。但丁花了七天穿越三界，我們只用了一個半小時。帶著這份感動，讓我們下樓回到人間——去超市採購南極船上的糧食吧。" }
                    ]
                }
            ]

                    { title: "歡迎來到南緯 54 度", text: "歡迎來到烏斯懷亞（Ushuaia），地球上最南端的城市，位於南緯 54 度 48 分。這座城市坐落在火地島的南岸，背靠馬歇爾山脈（Martial Mountains）的皚皚白雪，面朝比格爾海峽的碧藍海水。城市的座右銘是：「Ushuaia, fin del mundo, principio de todo」——世界的盡頭，一切的開始。" },
                    { title: "流放地的歷史", text: "烏斯懷亞的歷史始於懲罰。1896 年阿根廷政府在此建立了重刑犯監獄，利用囚犯來開發這片荒蕪之地——就像英國用澳大利亞一樣。囚犯們砍伐森林、鋪設鐵路、建造房屋，用血汗打造了這座城市的雛形。走在街上你會看到許多樹木被強勁的西風吹成同一個方向傾斜，當地人稱它們為「旗幟樹」（Árboles Bandera），因為它們的樹冠像被風展開的旗幟。這些樹是南美山毛櫸，能在時速超過 100 公里的狂風中存活，是生命韌性的最佳象徵。如今這座曾經的流放地已成為全球南極探險船隊的出發港，每年有超過十萬名旅客從這裡啟航。" }

                    { title: "聖克里斯多福號", text: "港口旁邊擱淺的這艘生鏽的船就是聖克里斯多福號（Saint Christopher），一艘英國建造的救援拖船。它在二戰期間曾參與北大西洋的船隊護航任務，戰後被賣到南美洲，在比格爾海峽執行海上救援工作。1954 年退役後，它被故意擱淺在烏斯懷亞港灣，如今鏽蝕的船體已成為海鳥的家園和攝影師的最愛。它靜靜地躺在這裡，見證了這座港口從荒涼小漁村到國際探險基地的半世紀變遷。" }

                { name: "監獄博物館", desc: "圓形監獄與歷史", sections: [
                    { title: "圓形全景設計", text: "烏斯懷亞海事與監獄博物館（Museo Marítimo y del Presidio）佔據了 1902 年至 1947 年間運作的國家監獄原址。這座監獄採用傑洛米·邊沁（Jeremy Bentham）提出的「全景敞視」（Panopticon）設計——五條翼樓從中央大廳呈放射狀延伸出去，獄警站在中心就能同時監控所有走廊。牆壁上的每一塊石頭都是囚犯親手從山上搬下來的。監獄建造本身就是懲罰的一部分。鼎盛時期這裡關押了超過 800 名囚犯，遠超設計容量，環境極其惡劣。門票一人 40,000 阿根廷披索。" },
                    { title: "零下的長夜", text: "烏斯懷亞的冬天，氣溫經常降到零下 15 度，日照時間只有七小時。在這種環境下，監獄的供暖系統經常故障。囚犯穿著黃色與藍色條紋的囚服——這個顯眼的配色不是為了美觀，而是為了防止逃跑：在白雪覆蓋的荒野中，條紋囚服讓逃犯無所遁形。但即使逃出監獄，外面等著他們的是濃密的原始森林、零下的嚴寒、以及完全與世隔絕的地理環境——火地島本身就是一座天然的巨大牢籠。" },
                    { title: "1 號翼樓", text: "博物館保留了 1 號翼樓的原始狀態，刻意不做任何修復。走進去，你會聞到陳年的霉味，感受到石牆透出的徹骨寒氣。狹小的牢房只有一張鐵床和一個馬桶，牆壁上還能看到囚犯用指甲刮出的刻痕——有些是計算日子，有些是名字，有些是無法辨識的符號，也許是絕望的塗鴉。這裡曾關押最危險的重刑犯，被稱為「活死人墓」。1947 年貝隆總統下令關閉這座監獄時，許多囚犯已在此度過了數十年光陰。" },
                    { title: "大耳矮子", text: "博物館裡最令人不安的展品是「大耳矮子」——卡耶塔諾·桑托斯·戈迪諾（Cayetano Santos Godino, 1896-1944）的蠟像。他是阿根廷歷史上第一個被記錄的連環殺手，綽號來自他異常大的耳朵與矮小的身材。他從少年時期就開始犯案，專門殺害幼童，手法殘忍。1912 年被捕時年僅 16 歲，因未成年免於死刑，被判終身監禁並送往烏斯懷亞。傳說他在獄中虐殺了監獄長養的貓，憤怒的獄友對他施以私刑，他最終死在牢房中，享年 48 歲。他的故事至今仍是阿根廷犯罪學研究的經典案例。" }

                    { title: "比格爾海峽", text: "比格爾海峽（Beagle Channel）是一條長約 240 公里的東西向水道，將火地島主島與南方的小島群分隔開來。它是被冰河切削出的峽灣——數百萬年前巨大的冰川像刀一樣劃開了安地斯山脈的尾端，留下了這條深邃的水道。海峽以英國皇家海軍的小獵犬號（HMS Beagle）命名，1833 年年僅 24 歲的查爾斯·達爾文搭乘這艘船通過這裡，他在日記中寫道：『這裡的荒涼超過了我的想像，但正是這種荒涼中蘊含著一種莊嚴的美。』正是這趟旅程中的觀察，為他日後提出演化論奠定了基礎。" },
                    { title: "雅馬納人", text: "在歐洲人到來之前，這片水域的主人是雅馬納人（Yámana），又稱雅甘人（Yaghan）。他們是世界最南端的原住民，已在此生活了至少六千年。令人驚嘆的是，雅馬納人即使在零度以下的氣溫中，也只穿極少的衣物——他們會在身上塗抹海獅油脂禦寒，身體已經演化出了更高的基礎代謝率。他們划著樹皮獨木舟在海峽中捕魚，女人負責潛入冰水中採集貝類。達爾文見到他們時深受震撼，稱他們為「地球上最悲慘的生物」——但這顯然是歐洲中心主義的偏見，事實上雅馬納人擁有極其複雜的語言和豐富的神話體系。如今純血統的雅馬納人僅剩下個位數，他們的語言被聯合國列為極度瀕危語言。" }

                { name: "生態巡禮", desc: "鳥島與海獅", sections: [
                    { title: "皇蘭威鸕鶿", text: "鳥島（Isla de los Pájaros）上密密麻麻的黑白色鳥類不是企鵝——牠們是皇蘭威鸕鶿（Imperial Cormorant），又稱藍眼鸕鶿（Blue-eyed Shag）。請用望遠鏡仔細看牠們的臉——眼睛周圍有一圈鮮豔的鈷藍色皮膚，繁殖季節會變得更加艷麗。牠們是高超的潛水獵手，可以潛入水下 60 公尺捕魚，每次閉氣長達四分鐘。鸕鶿與企鵝最大的區別是：鸕鶿會飛，企鵝不會。但牠們都選擇了同一種生存策略——用翅膀在水中「飛行」追捕魚群。牠們的羽毛不像其他水鳥那樣完全防水，所以你經常能看到牠們站在岩石上張開翅膀曬乾——那個姿勢像極了展翅的鷹。" },
                    { title: "海獅島", text: "海獅島（Isla de los Lobos）上棲息著南美海獅（South American Sea Lion）。公海獅體重可達 350 公斤，脖子上有像獅子一樣濃密的棕色鬃毛——這就是「海獅」名稱的由來。每頭公海獅都擁有一個「後宮」，由 5 到 15 頭母海獅組成。繁殖季節，公海獅會不停地吼叫、推擠、打架來爭奪地盤，勝者為王敗者為寇。仔細聽那些低沉的吼叫聲——那是雄性在宣示主權。而在島的邊緣，小海獅們正聚在一起組成「托兒所」，在淺水區笨拙地練習游泳。母海獅可以在數百隻幼崽中，靠著獨特的叫聲與氣味找到自己的孩子。" }

                    { title: "駛入火山口", text: "欺騙島（Deception Island）是南設得蘭群島中最奇特的島嶼——它是一座環形火山，火山口的一側坍塌形成了一個狹窄的缺口，稱為「海神的風箱」（Neptune's Bellows），寬度僅 230 公尺。我們的船將直接駛入這個缺口，進入被火山壁包圍的天然港灣——捕鯨人灣（Whalers Bay）。通過入口時請注意右側水下僅 2.5 公尺處有一塊暗礁，稱為「雷文岩」（Raven Rock），曾讓多艘船觸礁。當你的船突然從狂風大浪進入平靜如湖的內灣時，你就明白為什麼早期水手稱它為「欺騙」了——從外面看，完全看不出這裡面藏著一個避風港。" },

                    { title: "聽見冰的聲音", text: "搭乘 Zodiac 橡皮艇巡遊天堂灣時，請所有人保持安靜。當引擎關閉後，你會聽到一種奇妙的聲音——像氣泡水開瓶時的「波波波」聲，從四面八方的冰山中傳來。那是什麼？那是被封存在冰層中長達數萬年的遠古空氣氣泡，隨著冰山緩緩融化而被釋放出來的聲音。每一個氣泡裡都封存著幾萬年前的大氣——你聽到的，是地球的記憶在低語。藍色的冰山之所以呈現藍色，是因為冰層密度極高，壓縮掉了所有氣泡，只允許短波長的藍光通過。冰越藍，代表它越古老、越密實。" }

        {

            mainSpots: [
                { name: "企鵝家族", desc: "金圖、阿德利與頰帶", sections: [
                    { title: "金圖企鵝", text: "金圖企鵝（Gentoo Penguin）是南極第三大的企鵝，身高約 75 公分，體重約 5 至 8 公斤。辨識要點：鮮紅橘色的喙、頭頂上有一條白色的寬帶紋從眼睛延伸過去。牠們是水中的速度之王——游泳速度可達每小時 36 公里，是所有企鵝中最快的。金圖企鵝的求偶方式非常浪漫：雄性會在海灘上精挑細選一顆「完美的鵝卵石」，然後鄭重地叼起來獻給心儀的雌性。如果對方接受了石頭，就代表「我願意」。但牠們同時也是偷竊大師——當鄰居不注意時，經常偷偷把別人巢穴裡的石頭叼回自己家。科學家用攝影機記錄過一隻企鵝在一小時內偷了鄰居 62 顆石頭。" },
                    { title: "阿德利企鵝", text: "阿德利企鵝（Adélie Penguin）是南極最具代表性的企鵝，也是外觀最「經典」的——全黑的頭部配上白色的眼圈，身體黑白分明，像穿了一件完美的燕尾服。牠們以法國探險家杜蒙·杜維爾（Dumont d'Urville）的妻子 Adèle 命名。別看牠們只有 70 公分高，性格卻非常大膽好鬥——牠們是少數敢正面對抗賊鷗（Skua）的企鵝。賊鷗是南極最兇猛的掠食性鳥類，專門偷企鵝的蛋和幼雛，但阿德利企鵝會勇敢地用鰭狀肢拍打、用喙猛啄來驅趕入侵者。1911 年英國科學家 George Murray Levick 在觀察阿德利企鵝時，記錄到許多他認為「太過驚世駭俗」的行為，他的筆記被封存了整整一百年才公開。" },
                    { title: "頰帶企鵝", text: "頰帶企鵝（Chinstrap Penguin）最容易辨認：下巴有一條細細的黑色線條，像繫了安全帽的帶子。牠們是企鵝界的暴脾氣——巢穴之間的爭吵聲此起彼伏，經常為了一顆石頭或一寸地盤大打出手。頰帶企鵝偏好在陡峭的岩石斜坡上築巢，每天要爬上爬下無數次。全球約有 800 萬對頰帶企鵝，主要分布在南極半島和南設得蘭群島。近年來由於氣候變遷導致磷蝦數量減少，部分頰帶企鵝棲息地的族群數量已下降超過 75%。" }
                ]},
                { name: "海豹家族", desc: "豹海豹與威德爾", sections: [
                    { title: "豹海豹", text: "豹海豹（Leopard Seal）是南極的頂級掠食者，體長可達 3.5 公尺，體重超過 500 公斤。牠的頭部巨大，形狀像爬蟲類，嘴角永遠掛著一抹詭異的「微笑」——但別被那個笑容騙了，牠張開嘴時露出的鋸齒狀牙齒能將企鵝撕成碎片。豹海豹的狩獵方式極為殘忍：牠會在冰棚邊緣的水下埋伏，等企鵝跳入水中的瞬間一口咬住，然後劇烈甩動頭部，像甩毛巾一樣把企鵝甩得皮開肉綻。牠是南極唯一會主動獵食其他溫血動物的海豹。如果你在 Zodiac 上看到水面探出一顆蛇一樣的大頭，那就是牠——保持距離，但請盡情欣賞這位冰海之王。" },
                    { title: "威德爾海豹", text: "威德爾海豹（Weddell Seal）是南極最溫和可愛的海豹。牠的臉圓圓的，眼睛大大的，看起來像一隻肥貓，經常側躺在冰面上，嘴角微微上揚，露出一副滿足的微笑。但別小看這個「微笑殺手」——牠是世界上潛水能力最強的海豹之一，可以潛入水下 600 公尺，閉氣長達 82 分鐘。為了在冰層下生存，牠們必須用牙齒不斷啃咬冰面來維持呼吸孔的暢通，這導致牠們的牙齒磨損嚴重，壽命因此受限。最神奇的是牠們的歌聲——潛入水下時，威德爾海豹會發出一系列像電子合成器、像雷射光槍的奇異聲音，科學家至今仍未完全理解這些聲音的含義。" },
                    { title: "南方象海豹", text: "如果你有幸看到南方象海豹（Southern Elephant Seal），你會被牠的體型震撼——公象海豹可長到 5 至 6 公尺，體重高達 4,000 公斤，是世界上最大的海豹。牠們的鼻子像大象的鼻子一樣可以充氣膨脹，發出震耳欲聾的低吼聲來恐嚇對手。繁殖季節，公象海豹會為了爭奪交配權展開血腥的搏鬥，用滿是傷疤的胸部互相撞擊。二月正值換毛季節，牠們看起來格外邋遢——全身的皮膚大片脫落，像嚴重的曬傷——但這是完全正常的「災難性換毛」（Catastrophic Molt），新的毛皮很快會長出來。" }
                ]},
                { name: "鯨魚與海鳥", desc: "座頭鯨與信天翁", sections: [
                    { title: "座頭鯨", text: "座頭鯨（Humpback Whale）是南極水域最常見的大型鯨魚，體長可達 16 公尺，體重約 36 噸。牠們每年從熱帶繁殖地長途遷徙超過 8,000 公里來到南極覓食。最壯觀的行為是「氣泡網捕獵」（Bubble Net Feeding）：一群座頭鯨潛入磷蝦群下方，同時吐出氣泡形成一道螺旋上升的「氣泡網」，將磷蝦困在中央，然後所有鯨魚同時張著大嘴從下方衝出水面，一口吞下數千隻磷蝦。如果你看到水面上突然出現一圈冒泡的圓圈，請立刻準備好相機——數秒後就會有好幾張像貨車車庫般巨大的嘴巴破水而出。座頭鯨的尾鰭（fluke）花紋就像人的指紋，每一頭都獨一無二，科學家靠此來辨識個體。" },
                    { title: "漂泊信天翁", text: "穿越德雷克海峽時，你幾乎肯定會看到漂泊信天翁（Wandering Albatross）。牠擁有地球上所有鳥類中最大的翼展——可達 3.5 公尺，展開雙翅比一輛小轎車還寬。信天翁可以利用風力滑翔數千公里而不需要拍一下翅膀，牠們的飛行效率之高，心跳率在飛行中甚至低於休息時。一隻信天翁一年可以飛行超過 12 萬公里——相當於繞地球三圈。牠們終生配對，每兩年才繁殖一次，壽命可超過 60 年。水手們認為殺死信天翁會帶來厄運——這個傳說被英國詩人柯勒律治寫進了不朽名詩《古舟子詠》（The Rime of the Ancient Mariner）。" }

                    { title: "伊瓜蘇的由來", text: "「伊瓜蘇」（Iguazú）在南美原住民瓜拉尼語（Guaraní）中意為「大水」（I = 水，Guazú = 大）。這個名字毫不誇張——伊瓜蘇瀑布由 275 個瀑布組成，總寬度約 2.7 公里，是尼加拉瀑布寬度的四倍。每秒平均流量 1,500 立方公尺，雨季時可飆升至每秒 13,000 立方公尺。1984 年被列為聯合國世界遺產。瓜拉尼人有一個傳說：蛇神 M'Boi 愛上了一位美麗的少女，但少女與凡人私奔，憤怒的蛇神劈開了河床，讓戀人永遠無法團聚——那道裂縫就是今天的伊瓜蘇瀑布。" },

                    { title: "魔鬼的咽喉", text: "到了。魔鬼咽喉（Garganta del Diablo）——伊瓜蘇瀑布最壯觀的核心。這是一個 U 字形的深淵，寬 150 公尺、長 700 公尺、落差 82 公尺。14 道瀑布同時從三面懸崖傾瀉而下，每秒鐘有超過 750 立方公尺的河水墜入這個深淵。水霧衝天而起高達 100 公尺，在陽光下形成永恆的彩虹。站在觀景台上，你幾乎說不出話——不是因為感動，是因為水聲太大根本聽不見對方講話。面前是白色的水幕和深不見底的漩渦，腳下的水氣讓你的臉頰濕漉漉的。瓜拉尼人相信這裡是蛇神 M'Boi 張開的巨口，而你正站在牠的喉嚨口上方凝視深淵。" },

            mainSpots: [
                { name: "城市地標", desc: "最高塔與聖母山", sections: [
                    { title: "南美最高塔", text: "Costanera Center 的 Gran Torre Santiago 高 300 公尺，共 62 層，是南美洲最高的建築。頂層有一座 360 度全景觀景台「Sky Costanera」，天氣好的時候可以看到東邊連綿不絕的安地斯山脈雪峰——你正在看的就是美洲大陸的脊梁骨，全長 7,000 公里，從委內瑞拉一直延伸到火地島。聖地牙哥被安地斯山脈和海岸山脈夾在中間的一個盆地裡，所以空氣流通不佳，冬天經常有霧霾。整座城市有 700 萬人口，佔智利總人口的三分之一以上。" },
                    { title: "聖母山纜車", text: "聖克里斯托瓦爾山（Cerro San Cristóbal，海拔 880 公尺）是聖地牙哥最大的城市公園。我們搭乘的地面纜車（Funicular）自 1925 年運行至今，已有百年歷史，是智利的國家歷史古蹟。纜車沿著 45 度的斜坡緩緩爬升，兩側是鬱鬱蔥蔥的地中海型灌木叢。山頂矗立著一座 14 公尺高的聖母瑪利亞雕像（Virgen de la Inmaculada Concepción），白色的聖母張開雙臂守護著腳下的城市。從山頂俯瞰，聖地牙哥的棋盤式街道一覽無遺——往東看是安地斯雪山，往西看是太平洋方向的海岸山脈。下山時可以搭空中纜車（Teleférico）到 Oasis 站，換個角度欣賞城市全景。纜車套票一人 6,300 智利披索。" }
                ]},
                { name: "武器廣場與大教堂", desc: "殖民核心", sections: [
                    { title: "武器廣場", text: "武器廣場（Plaza de Armas）是聖地牙哥的歷史核心，1541 年西班牙征服者佩德羅·德·巴爾迪維亞（Pedro de Valdivia）在此建城時，就以這裡作為城市的中心。廣場四周環繞著殖民時期最重要的建築：北側是皇家法院（Real Audiencia），現為國家歷史博物館；西側是聖地牙哥主教座堂（Catedral Metropolitana），始建於 1748 年，是智利天主教的精神中心，內部的巴洛克式祭壇以胡桃木與金箔打造，莊嚴而華麗；東側是中央郵局，建築本身就是一座新古典主義傑作。廣場上棕櫚樹成蔭，退休老人在長椅上下棋，街頭藝人表演庫埃卡（Cueca）——智利的國舞，男女舞者揮舞白色手帕，模擬公雞追逐母雞的求偶動作。腳下的石板路已被數百年的腳步磨得光滑，每一塊都記錄著這座城市從殖民地到共和國的滄桑歲月。" },
                    { title: "中央市場", text: "武器廣場北邊兩個街區就是中央市場（Mercado Central），建於 1872 年，鍛鐵屋頂結構由智利建築師 Fermín Vivaceta 設計，曾在 1875 年的利馬世界博覽會上獲獎。走進去，抬頭看那座像大教堂般恢宏的鐵架穹頂——陽光透過玻璃天窗灑下，照亮了一排排鋪滿碎冰的海鮮攤位。智利擁有全世界最長的海岸線之一（6,435 公里），從北部的沙漠海岸到南部的冰川峽灣，冰冷的洪堡洋流帶來了驚人的海洋生物多樣性。市場裡必吃的是海鮮濃湯「Paila Marina」——用陶碗盛裝的滾燙湯品，裡面有淡菜、蛤蜊、蝦、鮭魚和章魚，配上幾滴檸檬汁和一籃剛出爐的麵包。另一道名菜是生海膽（Erizo），智利人直接用湯匙從海膽殼裡挖出橘紅色的生殖腺，擠上檸檬汁生吃——海水的鹹鮮與海膽的甘甜在口中爆開，是大海最原始的味道。" }
                ]},
                { name: "拉莫內達宮", desc: "總統府的傷痕", sections: [
                    { title: "建築與歷史", text: "拉莫內達宮（Palacio de La Moneda）是智利的總統府，位於憲法廣場（Plaza de la Constitución）南側。這座新古典主義建築由義大利建築師 Joaquín Toesca 設計，始建於 1784 年，原本是皇家鑄幣廠（Moneda 在西班牙語中就是「硬幣」的意思），1846 年才改為總統府。建築以白色石灰岩外牆、對稱的庭院和莊重的柱廊聞名，佔據了整整一個街區。每隔一天上午十點，在宮殿北門有衛兵交接儀式（Cambio de Guardia），穿著普魯士式軍服的儀仗兵在軍樂隊伴奏下正步前行——這個傳統源自十九世紀智利陸軍聘請德國軍事顧問的歷史。" },
                    { title: "1973年9月11日", text: "拉莫內達宮承載著智利最沈痛的記憶。1973 年 9 月 11 日，奧古斯托·皮諾切特（Augusto Pinochet）將軍發動軍事政變，推翻了民選總統薩爾瓦多·阿言德（Salvador Allende）。空軍的霍克獵人戰鬥機對總統府發射火箭彈，烈火吞噬了這座兩百年的建築。阿言德拒絕投降，在最後的廣播中對全國人民說：『我相信我對智利的忠誠將成為一種道德教訓，懲罰那些背信棄義、懦弱和叛國的人。』隨後他在燃燒的宮殿中身亡，據信是舉槍自盡。他手中的 AK-47 步槍是古巴領導人菲德爾·卡斯楚贈送的禮物。皮諾切特隨後建立了長達 17 年的軍事獨裁統治，期間超過三千人被殺害或失蹤。如今拉莫內達宮已修復如初，但北門的牆壁上仍刻意保留了一些彈痕——沈默而永恆的見證。宮殿地下層的文化中心（Centro Cultural La Moneda）免費對外開放，經常舉辦世界級的藝術展覽。" }
                ]},
                { name: "聶魯達故居", desc: "La Chascona", sections: [
                    { title: "詩人的秘密花園", text: "La Chascona（意為「亂髮女人」）是智利諾貝爾文學獎詩人巴勃羅·聶魯達（Pablo Neruda, 1904-1973）在聖地牙哥的故居，藏在聖克里斯托瓦爾山腳下 Bellavista 區的一條安靜小巷中。這棟房子建於 1953 年，是聶魯達為他的第三任妻子瑪蒂爾德·烏魯蒂亞（Matilde Urrutia）秘密建造的愛巢——「La Chascona」正是他對瑪蒂爾德那頭紅色捲髮的暱稱。聶魯達是個狂熱的收藏家，房子裡塞滿了他從世界各地帶回的奇物：非洲面具、船用羅盤、古董地圖、彩色玻璃瓶、一幅被他故意掛歪的肖像畫。整棟房子像一艘擱淺的船——狹窄的走廊、低矮的天花板、圓形的窗戶，因為聶魯達一輩子都夢想著大海。客廳裡有一幅墨西哥畫家 Diego Rivera 為瑪蒂爾德畫的雙面肖像——正面看是她的臉，側面看則隱藏著聶魯達的側臉輪廓。1973 年軍事政變後 12 天，聶魯達在醫院中去世（官方說法是前列腺癌，但長期以來有人懷疑他被毒殺）。軍方闖入 La Chascona 大肆破壞，砸碎了他的藏品並引水灌入地下室。瑪蒂爾德在廢墟中為聶魯達舉行了葬禮，那場葬禮意外地成為智利軍政府統治下的第一場公開抗議——送葬的人群在街上高唱《國際歌》。門票約 8,000 智利披索，含語音導覽。" }
                ]},
                { name: "智利葡萄酒", desc: "Carménère的新故鄉", sections: [
                    { title: "被遺忘的葡萄品種", text: "智利是世界第四大葡萄酒出口國，而它最傳奇的故事屬於一種名為 Carménère 的葡萄品種。Carménère 原產於法國波爾多，是十九世紀波爾多混釀的重要品種之一。1867 年根瘤蚜蟲病（Phylloxera）席捲歐洲，幾乎摧毀了所有葡萄園，Carménère 在法國被宣告滅絕。但沒有人知道，一個多世紀前，智利移民已經偷偷帶了一批 Carménère 藤蔓回到南美洲。由於智利被安地斯山脈、太平洋、阿塔卡馬沙漠和南極冰原四面封鎖，根瘤蚜蟲從未入侵——這些葡萄藤在智利的中央谷地安靜地生長了 150 年，被當成 Merlot（梅洛）種植，沒有人發現它們的真實身份。直到 1994 年，法國葡萄酒學家 Jean-Michel Boursiquot 在智利酒莊品嚐了一杯「Merlot」，驚訝地發現它的味道不對——經過 DNA 比對，證實這些「Merlot」其實是已在法國絕種的 Carménère！智利一夜之間從「仿冒者」變成了「拯救者」。Carménère 的風味帶有黑莓、青椒、黑巧克力和煙燻的氣息，單寧柔滑——今晚的晚餐，讓我們用一杯智利 Carménère 敬這段跨越兩個世紀的葡萄酒傳奇。" }
                ]},
                { name: "在地美食", desc: "Mote con Huesillo", sections: [{ title: "國民飲料", text: "在聖母山頂，你一定要嚐嚐智利的國民飲料「Mote con Huesillo」。這是一種甜點飲料——底部是煮軟的去皮小麥仁（Mote），上面放幾顆曬乾再用肉桂糖水煮過的桃子乾（Huesillo），然後加滿冰涼的焦糖色糖漿。一杯下肚，甜蜜清涼，小麥仁的Q彈口感配上桃子的果香，是消暑解渴的完美組合。這個飲料的歷史可以追溯到殖民時期，是西班牙甜食傳統與安地斯原住民穀物文化的結合。街邊推車賣的最道地，通常一杯只要 1,000 到 2,000 智利披索。" }] }
            ]
        },
        // === 2/22 - 2/25 阿塔卡馬 ===
        {
            date: "2026/2/22 (日)", location: "阿塔卡馬沙漠",
            mainSpots: [
                { name: "荒原地理", desc: "地球上的火星", sections: [
                    { title: "最乾燥之地", text: "歡迎來到阿塔卡馬沙漠（Desierto de Atacama）——地球上最乾燥的非極地沙漠。這裡有些地方已經數百年甚至數百萬年沒有下過雨。NASA 曾在這裡測試火星探測車，因為阿塔卡馬的地質和環境條件是地球上最接近火星的地方。我們所在的聖佩德羅德阿塔卡馬（San Pedro de Atacama）是一座海拔 2,400 公尺的綠洲小鎮，擁有約 5,000 名居民，土坯房與塵土飛揚的街道讓它保留了一種西部荒野的氣質。高海拔意味著空氣稀薄、紫外線強烈——請務必多喝水、塗防曬霜、戴帽子，動作放慢以適應高山反應。白天可達 30 度，夜晚可降到零下，溫差極大。" }
                ] },
                { name: "月亮谷", desc: "鹽與風的雕塑", sections: [
                    { title: "月球表面", text: "月亮谷（Valle de la Luna）得名於它像月球表面一樣荒涼的地貌。數百萬年來，風蝕和水蝕在這片由鹽層、黏土和砂岩組成的地層上雕刻出了詭異的地形——尖銳的稜線、深邃的峽谷、扭曲的岩柱。這裡完全沒有植被、沒有動物、沒有水——是地球上最接近「死亡」的景觀。我們會依次造訪圓形劇場（Amphitheater）——一個被風蝕出的半圓形巨大岩壁，回音效果驚人；大沙丘（Gran Duna）——可以攀登上去俯瞰整個山谷，沙丘上是一片絕對的寂靜，寂靜到你可以聽見自己的血液在太陽穴流動。" },
                    { title: "三姐妹岩與日落", text: "三姐妹岩（Tres Marías）是三座由鹽和黏土構成的風蝕岩柱，像三個披著斗篷的人站在荒野中。它們的形狀每年都在改變——風和偶爾的雨水持續雕刻著它們，也許幾百年後就會完全消失。傍晚時分，請安靜地站在岩石旁邊聽——你會聽到輕微的「啪啪」聲，那是岩石表面的鹽結晶因為日落後溫度驟降（熱脹冷縮）而爆裂的聲音。最後我們前往卡里觀景台（Mirador de Ckari，又稱 Coyote 石），這是月亮谷最著名的日落觀測點。夕陽會將整座山谷從土黃色漸漸染成橘紅色、玫瑰金色、最後轉為深紫色——這個持續約 40 分鐘的色彩魔幻時刻，是阿塔卡馬最令人屏息的景觀。" }
                ]},
                { name: "星空觀測", desc: "全球最清澈的星空", sections: [
                    { title: "為什麼是這裡", text: "阿塔卡馬沙漠擁有全球最清澈的星空，這不是誇飾——全球天文觀測條件最好的地方就在這裡。原因有三：第一，海拔高（2,400 至 5,000 公尺），空氣稀薄，大氣干擾少；第二，極度乾燥，全年幾乎無雲，年均降雨量不到 15 毫米；第三，遠離城市光害。因此，世界上最先進的天文望遠鏡群都選擇建在阿塔卡馬高原上——包括歐洲南方天文台的「超大望遠鏡」（VLT）、全球最大的毫米波天文台 ALMA（66 座碟形天線組成的陣列），以及正在建造的「極大望遠鏡」（ELT），它的主鏡口徑 39 公尺，完工後將成為人類有史以來最大的光學望遠鏡。" },
                    { title: "暗黑星座", text: "今晚的觀星團從九點開始。除了用數位望遠鏡觀測土星的光環、木星的衛星和獵戶座星雲之外，導覽員還會帶你認識一種特別的「星座」——阿塔卡梅尼奧原住民（Atacameño）的「暗黑星座」（Dark Constellations）。與西方天文學用明亮的星星連線不同，安地斯原住民看的是銀河中間那些不發光的暗黑區域——那些是宇宙塵埃遮擋背景星光形成的暗影。他們在暗影中看到了一隻黑色的羊駝（Llama Ñawi）正在銀河中喝水，旁邊跟著一隻小羊駝寶寶。還有一隻蟾蜍、一條蛇和一隻鷓鴣。對安地斯人來說，這些暗黑生物是生命的象徵——它們棲息在銀河之中，守護著大地的豐饒。抬頭看看，你能找到那隻喝水的黑色羊駝嗎？" }
                ] }
            ]
        },
        // === 2/23 阿塔卡馬：間歇泉與高原 ===
        {
            date: "2026/2/23 (一)", location: "塔蒂奧間歇泉",
            mainSpots: [
                { name: "塔蒂奧間歇泉", desc: "海拔4320公尺的地熱奇觀", sections: [
                    { title: "凌晨出發", text: "今天凌晨四點半出發——沒錯，天還沒亮。塔蒂奧間歇泉（El Tatio Geysers）位於海拔 4,320 公尺的安地斯高原上，距離聖佩德羅約 89 公里，車程約一個半小時。之所以要這麼早出發，是因為間歇泉的噴發在日出前後最為壯觀——清晨氣溫降至零下 10 到 15 度，地底湧出的滾燙蒸汽與冰冷空氣接觸，形成高達 6 到 8 公尺的白色蒸汽柱，在金色晨光中如夢似幻。太陽升高後氣溫回暖，蒸汽就會迅速消散。" },
                    { title: "間歇泉群", text: "塔蒂奧是南半球最大的間歇泉群，也是全球第三大，僅次於美國黃石公園和俄羅斯堪察加半島。整片地熱區域面積約 30 平方公里，擁有超過 80 個活躍的間歇泉、噴氣孔和熱泉池。地熱來源是地下約 8 公里深的岩漿庫——安地斯山脈是環太平洋火山帶的一部分，太平洋板塊（納茲卡板塊）以每年約 7 公分的速度潛沒到南美板塊之下，摩擦產生的巨大熱量加熱了地下水。水在地底被加熱到超過 85 度（高海拔氣壓低，水的沸點只有 86 度），沿著岩石裂隙噴湧而出。請注意腳下——地面的礦物沈積呈現出鐵鏽紅、硫磺黃和石灰白的交錯紋理，每一種顏色代表不同的化學成分。千萬不要踩到淺水灘——那些看起來平靜的水池溫度可能高達 80 度以上。" },
                    { title: "高原溫泉池", text: "間歇泉區域的下游有一個天然溫泉池，水溫約 30 到 35 度，可以下水泡湯。想像一下：你泡在海拔四千多公尺的溫泉裡，四周是白雪皚皚的安地斯火山，遠處的間歇泉蒸汽裊裊升起，頭頂是全世界最清澈的藍天——這可能是你這輩子最超現實的泡湯體驗。建議穿好泳衣和拖鞋，帶一條厚毛巾——上岸後的那一瞬間，零下的空氣會讓你深刻體會什麼叫做「冰火兩重天」。" }

                { name: "馬查卡小村", desc: "安地斯山中的時光膠囊", sections: [

    // ==========================================
    // 2. 狀態管理與導航
    // ==========================================
    const appView = document.getElementById('app-view');
    const breadcrumb = document.getElementById('breadcrumb');
    const btnBack = document.getElementById('btn-back');
    
    let state = { view: 'home', dayIndex: null, spotIndex: null };

    function navigate(view, dIdx = null, sIdx = null) {
        state.view = view;
        state.dayIndex = dIdx;
        state.spotIndex = sIdx;
        render();
        window.scrollTo(0, 0);
    }

    function goBack() {
        if (state.view === 'spot') navigate('day', state.dayIndex);
        else if (state.view === 'day') navigate('home');
    }

    function render() {
        appView.classList.remove('fade-in');
        void appView.offsetWidth;
        appView.classList.add('fade-in');

        if (state.view === 'home') renderHome();
        else if (state.view === 'day') renderDay();
        else if (state.view === 'spot') renderSpot();
    }

    function renderHome() {
        breadcrumb.innerText = "首頁";
        btnBack.style.display = "none";
        let html = `<div class="card-list">`;
        tourData.forEach((day, idx) => {
            const spotNames = day.mainSpots.map(s => s.name).join("、");
            html += `
                <div class="nav-card" onclick="navigate('day', ${idx})">
                    <div class="nav-card-title">${day.date}<span class="nav-card-arrow">➜</span></div>
                    <div class="nav-card-subtitle" style="color:#e67e22; font-weight:bold; margin-bottom:5px;">${day.location}</div>
                    <div class="nav-card-subtitle">包含：${spotNames}</div>
                </div>`;
        });
        appView.innerHTML = html + `</div>`;
    }

    function renderDay() {
        const day = tourData[state.dayIndex];
        breadcrumb.innerText = `首頁 > ${day.date}`;
        btnBack.style.display = "block";
        let html = `<div style="margin-bottom:15px; font-weight:bold; color:#2c3e50;">選擇景點：</div><div class="card-list">`;
        day.mainSpots.forEach((spot, idx) => {
            html += `
                <div class="nav-card" onclick="navigate('spot', ${state.dayIndex}, ${idx})">
                    <div class="nav-card-title">${spot.name}<span class="nav-card-arrow">➜</span></div>
                    <div class="nav-card-subtitle">${spot.desc}</div>
                </div>`;
        });
        appView.innerHTML = html + `</div>`;
    }

    function renderSpot() {
        const day = tourData[state.dayIndex];
        const spot = day.mainSpots[state.spotIndex];
        breadcrumb.innerText = `${day.date} > ${spot.name}`;
        btnBack.style.display = "block";
        let html = `<h2 style="color:#e67e22; margin-top:0;">${spot.name}</h2>`;
        spot.sections.forEach((sec, idx) => {
            html += `
                <div class="spot-detail-section">
                    <div class="section-header">
                        <div class="section-title">${sec.title}</div>
                        <button class="btn-speak-small" onclick="playSection(${idx})">🔊 朗讀</button>
                    </div>
                    <div class="section-text">${sec.text}</div>
                </div>`;
        });
        appView.innerHTML = html;
    }

    // ==========================================
    // 3. 語音功能
    // ==========================================
    const statusDiv = document.getElementById('status');
    const speedInput = document.getElementById('speed');
    const speedVal = document.getElementById('speed-val');
    const voiceSelect = document.getElementById('voice-select');
    let synth = window.speechSynthesis;
    let voices = [];

    function populateVoiceList() {
        voices = synth.getVoices();
        voiceSelect.innerHTML = '';
        if (voices.length === 0) { voiceSelect.innerHTML = '<option>無語音</option>'; return; }
        
        voices.sort((a, b) => {
            if (a.lang.includes('zh') && !b.lang.includes('zh')) return -1;
            if (!a.lang.includes('zh') && b.lang.includes('zh')) return 1;
            return 0;
        });

        voices.forEach((voice) => {
            const option = document.createElement('option');
            option.textContent = `${voice.name} (${voice.lang})`;
            option.value = voice.name;
            voiceSelect.appendChild(option);
        });
    }

    if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = populateVoiceList;
    setTimeout(populateVoiceList, 500);

    window.playSection = function(sectionIdx) {
        const spot = tourData[state.dayIndex].mainSpots[state.spotIndex];
        speak(spot.sections[sectionIdx].text);
    }

    window.resumeSpeaking = function() {
        if(synth.paused) { synth.resume(); statusDiv.innerText = "▶ 繼續播放..."; }
    };
    window.stopSpeaking = function() {
        synth.cancel(); statusDiv.innerText = "■ 已停止";
    };

    function speak(text) {
        synth.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-TW'; 
        utterance.rate = parseFloat(speedInput.value);
        
        const selectedVoice = voices.find(v => v.name === voiceSelect.value);
        if (selectedVoice) utterance.voice = selectedVoice;

        utterance.onstart = () => statusDiv.innerText = "🔊 正在導覽...";
        utterance.onend = () => statusDiv.innerText = "✅ 播放結束";
        synth.speak(utterance);
    }

    speedInput.addEventListener('input', (e) => speedVal.innerText = e.target.value + "x");

    // ==========================================
    // 4. AI 相機與 API (Git 版本)
    // ==========================================
    let videoStream = null;

    async function openCamera() {
        try {
            // 優先使用後鏡頭
            videoStream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment" } 
            });
            document.getElementById('camera-video').srcObject = videoStream;
            document.getElementById('camera-overlay').style.display = 'flex';
        } catch (err) {
            alert("相機啟動失敗：\n請確認您已將網頁上傳至 HTTPS 環境 (如 GitHub Pages)。\n錯誤: " + err);
        }
    }

    function closeCamera() {
        if(videoStream) videoStream.getTracks().forEach(t => t.stop());
        document.getElementById('camera-overlay').style.display = 'none';
        document.getElementById('ai-loading').style.display = 'none';
    }

    async function captureAndAnalyze() {
        const video = document.getElementById('camera-video');
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        
        // 1. 取得影像 Base64 (去除檔頭)
        const base64Image = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
        
        // 2. 顯示 Loading UI
        document.getElementById('ai-loading').style.display = 'block';
        
        // 3. 呼叫 Google Gemini API
        try {
            const response = await fetch(WORKER_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { inline_data: { mime_type: "image/jpeg", data: base64Image } },
                            { text: "你是一位資深導遊，正帶團遊覽南美洲與南極。請仔細觀察這張照片，辨識出畫面中的地標、建築、動物、植物或自然景觀。先用一句話說出你辨識到的是什麼，再撰寫一段約 100-150 字的生動導覽解說，就像在現場講給遊客聽一樣。請用繁體中文回答，不要加標題或分段符號。" }
                        ]
                    }]
                })
            });

            if(!response.ok) {
                const errData = await response.json().catch(() => ({}));
                const errMsg = errData?.error?.message || `HTTP ${response.status}`;
                throw new Error(errMsg);
            }

            const data = await response.json();

            if(data.candidates && data.candidates[0].content) {
                const aiText = data.candidates[0].content.parts[0].text;

                // 4. 關閉相機並播放
                closeCamera();
                speak(aiText);
                alert("🤖 AI 導遊觀察到：\n\n" + aiText);
            } else if(data.candidates && data.candidates[0].finishReason === 'SAFETY') {
                throw new Error("圖片被安全過濾器攔截，請換一張照片試試");
            } else {
                console.error("API 回應:", JSON.stringify(data));
                throw new Error(data?.error?.message || "AI 回應格式錯誤或 API 配額不足");
            }
        } catch (error) {
            document.getElementById('ai-loading').style.display = 'none';
            alert("辨識失敗: " + error.message);
            closeCamera();
        }
    }

    // 啟動主畫面
    render();

</script>
